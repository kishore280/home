<svg viewBox="0 0 150 20" width="150" height="20" xmlns="http://www.w3.org/2000/svg" data-loop="0.8"><style>.px{shape-rendering:crispEdges}.bl{animation:bl .8s steps(1) infinite}.bl2{animation-delay:-.4s}@keyframes bl{50%{opacity:0}}.beat{transform-box:fill-box;transform-origin:center;animation:be .8s ease-in-out infinite}@keyframes be{50%{transform:scale(1.25)}}.fl{animation:fl .8s steps(1) infinite}@keyframes fl{50%{fill:var(--alt)}}.bob{animation:bob .8s steps(2) infinite}@keyframes bob{50%{transform:translateY(-1px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="150" height="20" fill="#000"></rect><rect x="1.5" y="1.5" width="147" height="17" fill="none" stroke="#ff2a2a" stroke-dasharray="2 1"></rect><text x="34.28" y="14" font-size="10" fill="#ffffff" class="fl" style="--alt:#ff2a2a">MY BACK HURTS!!!!</text></svg>
