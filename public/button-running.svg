<svg data-loop="0.36" data-frame="0.09" xmlns="http://www.w3.org/2000/svg" width="88" height="31" viewBox="0 0 88 31">
  <style>.k{opacity:0;animation:k .36s steps(1) infinite}.k1{opacity:1}.k2{animation-delay:-.27s}.k3{animation-delay:-.18s}.k4{animation-delay:-.09s}@keyframes k{0%{opacity:1}25%{opacity:0}}.bob{animation:bob .18s steps(1) infinite}@keyframes bob{50%{transform:translateY(-.6px)}}.speed{animation:s .36s linear infinite}@keyframes s{0%{transform:translateX(2px);opacity:1}100%{transform:translateX(-5px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <title>running</title>
  <defs>
