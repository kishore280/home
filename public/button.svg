<svg data-loop="4.8" xmlns="http://www.w3.org/2000/svg" width="88" height="31" viewBox="0 0 88 31">
  <style>.waves{animation:w 2.4s ease-in-out infinite alternate}@keyframes w{to{transform:translateX(-6px)}}.glint{animation:g 1.2s ease-in-out infinite alternate}@keyframes g{to{opacity:.35}}.bird{animation:b 4.8s linear infinite}@keyframes b{0%{transform:translate(-40px,4px)}100%{transform:translate(60px,-2px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <title>beach</title>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#a98ce8"/>
      <stop offset=".55" stop-color="#e7a6d0"/>
      <stop offset="1" stop-color="#ffc59a"/>
    </linearGradient>
    <clipPath id="frame"><rect width="88" height="31" rx="2"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" stroke="#2e2540" stroke-linejoin="round" stroke-linecap="round">
    <!-- sky -->
    <rect width="88" height="20" fill="url(#sky)" stroke="none"/>
    <!-- sun on the horizon -->
    <circle cx="64" cy="18" r="8.5" fill="#ffd24a" stroke-width=".8"/>
    <!-- sea -->
    <rect y="18" width="88" height="13" fill="#3bb3c8" stroke-width=".8"/>
    <path class="glint" d="M57 21h14M59.5 23.5h9M61.5 26h5" stroke="#ffe27a" stroke-width="1"/>
    <path class="waves" d="M44 22q2-1.5 4 0t4 0M76 24q2-1.5 4 0t4 0M46 27.5q2-1.5 4 0t4 0" fill="none" stroke="#fff" stroke-width=".8"/>
    <!-- sand -->
    <path d="M-1 22.5q20-2 40 9.5H-1Z" fill="#f6d28a" stroke-width=".8"/>
    <circle cx="8" cy="27.5" r=".6" fill="#2e2540" stroke="none"/><circle cx="22" cy="29" r=".6" fill="#2e2540" stroke="none"/>
    <!-- coconut palm -->
    <path d="M17 28.5q-1-9 5-19.5" fill="none" stroke-width="3.2"/>
    <path d="M17 28.5q-1-9 5-19.5" fill="none" stroke="#b0703f" stroke-width="1.8"/>
    <g fill="#46a862" stroke-width=".8">
      <path d="M22 9q-7-4-13 1q6-1 13-1Z"/>
      <path d="M22 9q-4-7-11-6q7 2 11 6Z"/>
      <path d="M22 9q3-7 10-5q-6 1-10 5Z"/>
      <path d="M22 9q7-2 11 4q-5-3-11-4Z"/>
      <path d="M22 9q1 6-4 10q2-5 4-10Z"/>
    </g>
    <circle cx="21" cy="10.5" r="1.3" fill="#7a4a2a" stroke-width=".7"/>
    <circle cx="23.2" cy="10.2" r="1.3" fill="#7a4a2a" stroke-width=".7"/>
    <!-- bird -->
    <path class="bird" d="M34 3.5q1-1 2 0q1-1 2 0" fill="none" stroke-width=".7"/>
  </g>
  <rect x=".5" y=".5" width="87" height="30" rx="2" fill="none" stroke="#2e2540"/>
</svg>
