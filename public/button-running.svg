<svg xmlns="http://www.w3.org/2000/svg" width="88" height="31" viewBox="0 0 88 31">
  <title>running</title>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#a98ce8"/>
      <stop offset="1" stop-color="#ffc59a"/>
    </linearGradient>
    <clipPath id="frame"><rect width="88" height="31" rx="2"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" stroke="#2e2540" stroke-linejoin="round" stroke-linecap="round">
    <rect width="88" height="31" fill="url(#sky)" stroke="none"/>
    <!-- morning sun rising over the sea -->
    <circle cx="16" cy="15" r="6.5" fill="#ffd24a" stroke-width=".8"/>
    <rect y="14" width="88" height="7" fill="#3bb3c8" stroke-width=".8"/>
    <path d="M10 16.5h12M12.5 18.5h7" stroke="#ffe27a" stroke-width=".9"/>
    <path d="M30 17q2-1.5 4 0t4 0M66 16.5q2-1.5 4 0t4 0" fill="none" stroke="#fff" stroke-width=".7"/>
    <!-- wet sand with foam line, then dry sand -->
    <path d="M-1 20q20-1.5 45 0t45 0V32H-1Z" fill="#f6d28a" stroke-width=".8"/>
    <path d="M-1 21.2q20-1.5 45 0t45 0" fill="none" stroke="#fff" stroke-width=".7" opacity=".8"/>
    <!-- footprints behind the runner -->
    <g fill="#d9ad62" stroke="none">
      <ellipse cx="18" cy="26.5" rx="1.3" ry=".6"/><ellipse cx="25" cy="28" rx="1.3" ry=".6"/>
      <ellipse cx="32" cy="26.5" rx="1.3" ry=".6"/><ellipse cx="39" cy="28" rx="1.3" ry=".6"/>
      <ellipse cx="46" cy="26.5" rx="1.3" ry=".6"/>
    </g>
    <!-- speed lines -->
    <path d="M44 8h6M42 11.5h7M45 15h5" stroke="#fff" stroke-width=".9"/>
    <!-- runner, mid-stride, facing right -->
    <g stroke-width="2.4">
      <path d="M56 17.5 52.5 21.5 49.5 21" fill="none"/>
      <path d="M57.5 17.5l3.5 3.8 1 5.2" fill="none"/>
      <path d="M58 10.5l-3.8 2.6 1.8 3" fill="none"/>
    </g>
    <g stroke="#9c6644" stroke-width="1.2">
      <path d="M56 17.5 52.5 21.5 49.5 21" fill="none"/>
      <path d="M57.5 17.5l3.5 3.8 1 5.2" fill="none"/>
      <path d="M58 10.5l-3.8 2.6 1.8 3" fill="none"/>
    </g>
    <!-- shoes -->
    <path d="M48.3 20.2l2.6.4-.4 1.6-2.6-.5Z" fill="#f2a7c3" stroke-width=".6"/>
    <path d="M61 26.4h3.6v1.4H61Z" fill="#f2a7c3" stroke-width=".6"/>
    <!-- shorts and shirt -->
    <path d="M55 15.8h4.4l.6 2.6-2.4.6-.8-.8-1.4 1-1.4-1.2Z" fill="#2b2733" stroke-width=".6"/>
    <path d="M56 9.4l3.4-.4 1.2 3.4-.8 4h-4.4l-.4-3.6Z" fill="#9b7fe0" stroke-width=".7"/>
    <!-- front arm swinging forward -->
    <path d="M59.6 10.6l2.6 3 3.2-1.4" fill="none" stroke-width="2.4"/>
    <path d="M59.6 10.6l2.6 3 3.2-1.4" fill="none" stroke="#9c6644" stroke-width="1.2"/>
    <!-- head with hair -->
    <circle cx="59.2" cy="6.2" r="2.6" fill="#9c6644" stroke-width=".7"/>
    <path d="M56.8 5.6q.6-3.2 3.6-2.8 1.8.4 1.4 1.8-1.8-.6-3.2.2-.8.4-1.8.8Z" fill="#231f2e" stroke-width=".5"/>
  </g>
  <rect x=".5" y=".5" width="87" height="30" rx="2" fill="none" stroke="#2e2540"/>
</svg>
